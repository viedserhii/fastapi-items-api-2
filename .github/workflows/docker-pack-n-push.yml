name: Docker Pack and Push

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      tag:
        required: true
        type: string
      push_to_registry:
        required: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_registry }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ inputs.push_to_registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.repository }}:${{ inputs.tag }}

      - name: Build Docker image for artifact
        if: ${{ !inputs.push_to_registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.repository }}:${{ inputs.tag }}

      - name: Save Docker image
        if: ${{ !inputs.push_to_registry }}
        run: docker save "${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.repository }}:${{ inputs.tag }}" -o /tmp/fastapi-items-api.tar

      - name: Prepare artifact name
        if: ${{ !inputs.push_to_registry }}
        id: artifact-name
        shell: bash
        run: |
          SAFE_BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          echo "name=docker-image-${SAFE_BRANCH_NAME}-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Upload Docker image artifact
        if: ${{ !inputs.push_to_registry }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: /tmp/fastapi-items-api.tar
          if-no-files-found: error