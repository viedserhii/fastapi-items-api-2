name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-n-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build application
        run: python -m compileall app
      - name: Run unit tests
        run: pytest -q

  docker-pack-n-push:
    name: Docker Pack and Push
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
      tag: latest
      push_to_registry: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
